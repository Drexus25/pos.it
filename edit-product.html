<!doctype html>
<html lang="id" data-bs-theme="light">
    <head>
        <title>Ubah Produk — pos.it</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link href="css/dashboardStyle.css" rel="stylesheet" />
        <link href="css/addProductStyle.css" rel="stylesheet" />
        <script src="js/productsData.js"></script>
        <script src="js/companyProfile.js"></script>
        <script src="js/sonner.js"></script>
    </head>

    <body>

        <div class="topbar">
            <a href="index.html" class="topbar-brand">
                <span class="topbar-brand-logo"><i class="bi bi-box"></i></span>
                pos.it
            </a>
            <div class="topbar-right">
                
                <div class="topbar-user">
                    <span class="topbar-avatar">D</span>
                    <div class="topbar-user-info">
                        <span class="topbar-user-name">Damar</span>
                        <span class="topbar-user-role">Pemilik • seluruh akses</span>
                    </div>
                    
                </div>
            </div>
        </div>

        <aside class="sidebar">

            <a href="dashboard.html" class="nav-item">
                <i class="bi bi-grid-1x2"></i> Beranda
            </a>
            <a href="products.html" class="nav-item active">
                <i class="bi bi-box-seam"></i> Produk
            </a>
            <a href="cashier.html" class="nav-item">
                <i class="bi bi-receipt"></i> Kasir
            </a>
            <a href="report.html" class="nav-item">
                <i class="bi bi-graph-up"></i> Laporan
            </a>
            <a href="stock.html" class="nav-item">
                <i class="bi bi-archive"></i> Stok
            </a>
            <a href="profile.html" class="nav-item">
                <i class="bi bi-gear"></i> Profil
            </a>
            <div class="sidebar-spacer"></div>
            <div class="sidebar-logout">
                <a href="login.html" class="nav-item">
                    <i class="bi bi-box-arrow-left"></i> Keluar
                </a>
            </div>
        </aside>

        <main class="main-content">

            <div class="page-header">
                <h1 class="page-title">Ubah produk</h1>
            </div>

            <form id="editProductForm" novalidate>
                <div class="add-product-layout">

                    <div class="left-col-add">
                        <div class="form-card">
                            <div class="form-card-title">Informasi produk</div>

                            <div style="margin-bottom: 16px;">
                                <label class="form-label-custom" for="namaProduk">
                                    Nama produk <span class="required">*</span>
                                </label>
                                <input type="text" id="namaProduk" class="form-input" />
                            </div>

                            <div class="form-row" style="margin-bottom: 16px;">
                                <div>
                                    <label class="form-label-custom" for="hargaJual">
                                        Harga jual <span class="required">*</span>
                                    </label>
                                    <input type="text" id="hargaJual" class="form-input" />
                                </div>
                                <div>
                                    <label class="form-label-custom" for="kategori">Kategori (opsional)</label>
                                    <select id="kategori" class="form-input form-select-custom">
                                        <option value=""></option>
                                        <option value="Minuman">Minuman</option>
                                        <option value="Makanan">Makanan</option>
                                        <option value="Lainnya">Lainnya</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="form-label-custom" for="deskripsi">Deskripsi (opsional)</label>
                                <textarea id="deskripsi" class="form-input form-textarea"></textarea>
                            </div>
                        </div>

                        <div class="form-card">
                            <div class="form-card-title">Persediaan</div>
                            <div class="form-row">
                                <div>
                                    <label class="form-label-custom" for="stokSaatIni">Stok saat ini</label>
                                    <input type="text" id="stokSaatIni" class="form-input" />
                                </div>
                                <div>
                                    <label class="form-label-custom" for="batasMinimum">Batas minimum stok</label>
                                    <input type="number" id="batasMinimum" class="form-input" min="0" />
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-hapus-produk" id="btnDeleteProduct">
                                <i class="bi bi-trash3"></i> Hapus produk
                            </button>
                            <div class="form-actions-right">
                                <a href="products.html" class="btn-batal">Batal</a>
                                <button type="submit" class="btn-simpan">
                                    <i class="bi bi-check-lg"></i> Simpan perubahan
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="right-col-add">
                        <div class="form-card">
                            <div class="form-card-title">Gambar produk</div>
                            <div class="image-upload-area" id="imagePreviewArea">
                                <i class="bi bi-cup-hot"></i>
                            </div>
                            <input type="file" id="imageInput" accept="image/jpeg,image/png" style="display:none;" />
                            <button type="button" class="btn-ganti-gambar" onclick="document.getElementById('imageInput').click()">
                                <i class="bi bi-upload"></i> Ganti gambar
                            </button>
                        </div>

                        <div class="form-card">
                            <div class="form-card-title">Status produk</div>
                            <div id="statusBadge"></div>
                            <button type="button" class="btn-toggle-status" id="toggleStatusBtn">
                                <i class="bi bi-gear"></i>
                                <span id="toggleStatusLabel"></span>
                            </button>
                        </div>
                    </div>

                </div>
            </form>

        </main>

        <script>
            const params = new URLSearchParams(window.location.search);
            const idParam = params.get('id');
            const id = idParam !== null ? parseInt(idParam) : 0;
            const product = getProductById(id) || getProducts()[0];

            if (!product) {
                toast.error('Produk tidak ditemukan!');
                setTimeout(() => {
                    window.location.href = 'products.html';
                }, 900);
                throw new Error('Produk tidak ditemukan');
            }

            let uploadedImageData = product.image || null;

            document.getElementById('namaProduk').value  = product.nama;
            document.getElementById('hargaJual').value   = typeof product.harga === 'number' ? formatHarga(product.harga) : product.harga;
            document.getElementById('deskripsi').value   = product.deskripsi || '';
            document.getElementById('stokSaatIni').value = typeof product.stok === 'number' ? `${product.stok} ${product.satuan || 'pcs'}` : product.stok;
            document.getElementById('batasMinimum').value = product.minStok !== undefined ? product.minStok : 5;

            const sel = document.getElementById('kategori');
            for (const opt of sel.options) {
                if (opt.value === product.kategori) { opt.selected = true; break; }
            }

            if (product.image) {
                document.getElementById('imagePreviewArea').innerHTML = `<img src="${product.image}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" />`;
            }

            let currentStatus = product.status || 'aktif';

            function renderStatus() {
                const badge = document.getElementById('statusBadge');
                const label = document.getElementById('toggleStatusLabel');
                if (currentStatus === 'aktif') {
                    badge.innerHTML = '<span class="status-badge-aktif">Aktif</span>';
                    label.textContent = 'Nonaktifkan produk';
                } else {
                    badge.innerHTML = '<span class="status-badge-nonaktif">Nonaktif</span>';
                    label.textContent = 'Aktifkan produk';
                }
            }

            document.getElementById('toggleStatusBtn').addEventListener('click', () => {
                currentStatus = currentStatus === 'aktif' ? 'nonaktif' : 'aktif';
                renderStatus();
            });

            document.getElementById('imageInput').addEventListener('change', function () {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = e => {
                    uploadedImageData = e.target.result;
                    const area = document.getElementById('imagePreviewArea');
                    area.innerHTML = `<img src="${uploadedImageData}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" />`;
                };
                reader.readAsDataURL(file);
            });

            document.getElementById('editProductForm').addEventListener('submit', e => {
                e.preventDefault();

                const nama = document.getElementById('namaProduk').value.trim();
                const rawPrice = document.getElementById('hargaJual').value.replace(/\D/g, '');
                const harga = rawPrice ? Number(rawPrice) : product.harga;
                const kategoriVal = document.getElementById('kategori').value;
                const desc = document.getElementById('deskripsi').value.trim();
                const stokRaw = document.getElementById('stokSaatIni').value.replace(/\D/g, '');
                const stokNum = stokRaw !== '' ? Number(stokRaw) : (typeof product.stok === 'number' ? product.stok : 0);
                const minStokVal = Number(document.getElementById('batasMinimum').value) || 0;

                if (!nama) {
                    alert('Nama produk tidak boleh kosong.');
                    return;
                }

                updateProduct(product.id, {
                    nama: nama,
                    harga: harga,
                    kategori: kategoriVal,
                    deskripsi: desc,
                    stok: stokNum,
                    minStok: minStokVal,
                    status: currentStatus,
                    image: uploadedImageData
                });

                toast.success('Perubahan berhasil disimpan!');
                setTimeout(() => {
                    window.location.href = 'products.html';
                }, 900);
            });

            document.getElementById('btnDeleteProduct').addEventListener('click', () => {
                toast.confirm(`Hapus produk "${product.nama}"?`, {
                    description: 'Tindakan ini tidak dapat dibatalkan.',
                    confirmText: 'Hapus Produk',
                    cancelText: 'Batal',
                    danger: true,
                    onConfirm: () => {
                        deleteProduct(product.id);
                        toast.success('Produk berhasil dihapus!');
                        setTimeout(() => {
                            window.location.href = 'products.html';
                        }, 900);
                    }
                });
            });

            renderStatus();
        </script>

    </body>
</html>
