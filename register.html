<!doctype html>
<html lang="id" data-bs-theme="light">
    <head>
        <title>Daftar — pos.it</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link href="style.css" rel="stylesheet" />
        <style>
            html, body { height: 100%; }

            .login-left {
                background-color: #7d2e0e;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 36px 40px;
                color: #fff;
            }
            .login-left .brand-logo {
                width: 36px;
                height: 36px;
                background-color: rgba(255,255,255,0.2);
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
            }
            .login-left h2 {
                font-size: 2.2rem;
                font-weight: 800;
                line-height: 1.15;
            }
            .login-left p { color: rgba(255,255,255,0.75); font-size: 0.9rem; }
            .login-left .footer-text { color: rgba(255,255,255,0.5); font-size: 0.8rem; }

            .login-right {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            .login-right .top-nav {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 32px;
                font-size: 0.875rem;
            }
            .login-right .top-nav a { color: #4b5563; text-decoration: none; }
            .login-right .top-nav a:hover { color: #1a1a1a; }
            .login-right .form-area {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 40px 80px;
                max-width: 560px;
                width: 100%;
                margin: 0 auto;
            }
            .login-right .bottom-note {
                padding: 20px 32px;
                text-align: center;
                font-size: 0.8rem;
                color: #9ca3af;
            }

            .form-control {
                border-radius: 8px;
                border-color: #d1d5db;
                padding: 10px 14px;
                font-size: 0.9rem;
            }
            .form-control:focus {
                border-color: #7d2e0e;
                box-shadow: 0 0 0 3px rgba(125,46,14,0.12);
            }
            .input-group .input-group-text {
                background: #fff;
                border-color: #d1d5db;
                border-radius: 0 8px 8px 0;
                color: #9ca3af;
                cursor: pointer;
            }
            .input-group .form-control {
                border-right: none;
                border-radius: 8px 0 0 8px;
            }
            .input-group .form-control:focus + .input-group-text {
                border-color: #7d2e0e;
            }

            .btn-login {
                background-color: #7d2e0e;
                color: #fff;
                border: none;
                border-radius: 8px;
                padding: 12px;
                font-weight: 600;
                font-size: 0.95rem;
                width: 100%;
            }
            .btn-login:hover { background-color: #6b2609; color: #fff; }

            .link-orange {
                color: #7d2e0e;
                font-weight: 600;
                text-decoration: none;
            }
            .link-orange:hover { text-decoration: underline; color: #6b2609; }

            .form-check-input:checked {
                background-color: #7d2e0e;
                border-color: #7d2e0e;
            }
            .form-check-input:focus { box-shadow: 0 0 0 3px rgba(125,46,14,0.12); }

            @media (max-width: 767px) {
                .login-left { min-height: auto; padding: 28px 24px; }
                .login-right .form-area { padding: 32px 24px; }
            }
        </style>
    </head>

    <body>
        <div class="container-fluid p-0">
            <div class="row g-0">

                <div class="col-md-5 col-lg-4 login-left">
                    <div>
                        <a href="index.html" class="d-flex align-items-center gap-2 text-white text-decoration-none fw-bold mb-5">
                            <span class="brand-logo"><i class="bi bi-box"></i></span>
                            pos.it
                        </a>
                    </div>
                    <div>
                        <h2 class="mb-3">Usaha tertata.<br>Hari lebih tenang.</h2>
                        <p>Dari pesanan pertama hingga laporan harian, semua ada di satu tempat.</p>
                    </div>
                    <div>
                        <span class="footer-text">© 2026 pos.it • Dirancang untuk usaha Anda</span>
                    </div>
                </div>

                <div class="col-md-7 col-lg-8 login-right">
                    <div class="top-nav">
                        <a href="index.html"><i class="bi bi-arrow-left me-1"></i></a>
                    </div>

                    <div class="form-area">
                        <h3 class="fw-bold mb-4" style="font-size: 1.75rem;">Mulai ruang kerja Anda.</h3>

                        <form>
                            <div class="mb-4">
                                <label class="form-label fw-semibold small" for="businessName">Nama usaha</label>
                                <input type="text" class="form-control" id="businessName" placeholder="ex: Kafe IMKafe" />
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small" for="email">Email atau nomor HP</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="email" placeholder="ex: damar@imkafe.id" />
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small" for="password">Kata sandi</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" />
                                    <span class="input-group-text" id="togglePassword" role="button" title="Tampilkan kata sandi">
                                        <i class="bi bi-eye-slash" id="toggleIcon"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="agree" />
                                <label class="form-check-label small" for="agree">
                                    Saya menyetujui <a href="#" class="link-orange">Ketentuan Layanan</a> dan <a href="#" class="link-orange">Kebijakan Privasi</a> pos.it.
                                </label>
                            </div>

                            <button type="submit" class="btn btn-login mb-4">
                                <i class="bi bi-arrow-right me-1"></i> Daftar
                            </button>

                            <p class="text-center text-secondary small mb-0">
                                Sudah punya akun? <a href="login.html" class="link-orange">Masuk</a>
                            </p>
                        </form>
                    </div>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script>
            const toggle = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            toggle.addEventListener('click', () => {
                const isHidden = passwordInput.type === 'password';
                passwordInput.type = isHidden ? 'text' : 'password';
                toggleIcon.className = isHidden ? 'bi bi-eye' : 'bi bi-eye-slash';
            });
        </script>
    </body>
</html>
