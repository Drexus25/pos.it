<!doctype html>
<html lang="id" data-bs-theme="light">
    <head>
        <title>Daftar - pos.it</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link href="css/registerStyle.css" rel="stylesheet" />
        <script src="js/sonner.js"></script>
    </head>

    <body>
        <div class="container-fluid p-0">
            <div class="row g-0">

                <div class="d-none d-md-flex col-md-5 col-lg-4 login-left">
                    <div>
                        <a href="index.html" class="d-flex align-items-center gap-2 text-white text-decoration-none fw-bold mb-5">
                            <span class="brand-logo"><i class="bi bi-box"></i></span>
                            pos.it
                        </a>
                    </div>
                    <div>
                        <h2 class="mb-3">Usaha tertata.<br>Hari lebih tenang.</h2>
                        <p>Dari pesanan pertama hingga laporan harian, semua ada di satu tempat.</p>
                    </div>
                    <div>
                        <span class="footer-text">pos.it - Dirancang untuk usaha Anda</span>
                    </div>
                </div>

                <div class="col-12 col-md-7 col-lg-8 login-right">
                    <div class="top-nav">
                        <a href="index.html"><i class="bi bi-arrow-left me-1"></i></a>
                    </div>

                    <div class="form-area">
                        <h3 class="fw-bold mb-4" style="font-size: 1.75rem;">Mulai ruang kerja Anda.</h3>

                        <form id="registerForm" novalidate>
                            <div class="mb-4">
                                <label class="form-label fw-semibold small" for="businessName">Nama usaha</label>
                                <input type="text" class="form-control" id="businessName" />
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small" for="email">Email atau nomor HP</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="email"/>
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small" for="password">Kata sandi</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password"/>
                                    <span class="input-group-text" id="togglePassword" role="button" title="Tampilkan kata sandi">
                                        <i class="bi bi-eye-slash" id="toggleIcon"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="agree" />
                                <label class="form-check-label small" for="agree">
                                    Saya menyetujui <a href="#" class="link-orange">Ketentuan Layanan</a> dan <a href="#" class="link-orange">Kebijakan Privasi</a> pos.it.
                                </label>
                            </div>

                            <button type="submit" class="btn btn-login mb-4">
                                <i class="bi bi-arrow-right me-1"></i> Daftar
                            </button>

                            <p class="text-center text-secondary small mb-0">
                                Sudah punya akun? <a href="login.html" class="link-orange">Masuk</a>
                            </p>
                        </form>
                    </div>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script>
            const toggle = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            const businessInput = document.getElementById('businessName');
            const emailInput = document.getElementById('email');
            const agreeCheckbox = document.getElementById('agree');

            businessInput.addEventListener('input', () => businessInput.classList.remove('is-invalid'));
            emailInput.addEventListener('input', () => emailInput.classList.remove('is-invalid'));
            passwordInput.addEventListener('input', () => passwordInput.classList.remove('is-invalid'));

            toggle.addEventListener('click', () => {
                const isHidden = passwordInput.type === 'password';
                passwordInput.type = isHidden ? 'text' : 'password';
                toggleIcon.className = isHidden ? 'bi bi-eye' : 'bi bi-eye-slash';
            });

            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const business = businessInput.value.trim();
                const credential = emailInput.value.trim();
                const password = passwordInput.value;

                if (!business) {
                    businessInput.classList.add('is-invalid');
                    toast.warning('Nama usaha wajib diisi.');
                    businessInput.focus();
                    return;
                }

                if (!credential) {
                    emailInput.classList.add('is-invalid');
                    toast.warning('Email atau nomor HP wajib diisi.');
                    emailInput.focus();
                    return;
                }

                if (!password || password.length < 6) {
                    passwordInput.classList.add('is-invalid');
                    toast.warning('Kata sandi minimal 6 karakter.');
                    passwordInput.focus();
                    return;
                }

                if (!agreeCheckbox.checked) {
                    toast.warning('Anda harus menyetujui ketentuan layanan untuk melanjutkan.');
                    agreeCheckbox.focus();
                    return;
                }

                const registeredUsers = JSON.parse(localStorage.getItem('pos_registered_users') || '[]');
                const exists = registeredUsers.some(u => u.credential.toLowerCase() === credential.toLowerCase());
                if (exists || credential === 'damar@imkafe.id' || credential === '081234567890') {
                    emailInput.classList.add('is-invalid');
                    toast.error('Email atau nomor HP sudah terdaftar.');
                    emailInput.focus();
                    return;
                }

                registeredUsers.push({
                    credential: credential,
                    password: password,
                    name: business,
                    role: 'owner',
                    business: business
                });
                localStorage.setItem('pos_registered_users', JSON.stringify(registeredUsers));

                toast.success('Pendaftaran berhasil! Mengalihkan ke halaman masuk...');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 900);
            });
        </script>
    </body>
</html>
